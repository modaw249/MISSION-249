<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <title>MISSION 249 | المهمة 249</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-container">
    <header class="game-header">
      <div class="logo">249</div>
      <div>
        <h1>MISSION 249</h1>
        <p>المهمة 249</p>
      </div>
    </header>

    <section class="main-screen">
      <div class="status">
        <span>نظام الدرون</span>
        <span class="status-online">● جاهز</span>
      </div>

      <div class="game-title">
        <h2>عملية وادي سيدنا</h2>
        <p>مهمة استطلاع جوي خيالية في السودان</p>
      </div>

      <div class="mission-info">
        <p>الهدف: مرافقة الموكب إلى قاعدة وادي سيدنا</p>
        <p>نمط اللعب: استطلاع وحماية</p>
        <p>الكاميرا: عادية وحرارية</p>
      </div>

      <button id="startButton">ابدأ المهمة</button>
      <button id="settingsButton">الإعدادات</button>
    </section>

    <footer>
      <p>MISSION 249 © 2026</p>
      <p>تعمل دون اتصال بالإنترنت بعد تجهيز ملفات اللعبة</p>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
